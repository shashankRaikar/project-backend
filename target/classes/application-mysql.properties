# MySQL Profile Configuration
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or: --spring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://localhost:3306/registration_login_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
