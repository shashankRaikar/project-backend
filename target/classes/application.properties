# Server Configuration
server.port=3030

# Spring Application Name
spring.application.name=registrationloginbackend

# Database Configuration: In-memory MySQL-compatible database for instant out-of-the-box operation
# To switch to local MySQL Server 8.0, run with --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:registration_login_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# JWT Security Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# 1 hour in milliseconds (3600 * 1000)
jwt.expiration-ms=3600000
jwt.cookie-name=authToken

# CORS Allowed Origins
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
